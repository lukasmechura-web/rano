<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HI Ráno">
<meta name="theme-color" content="#051822">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Perfektní ráno</title>
<style>
/* Layout: mobilní appka v brandu HI, navy hlavička s logem, 5 záložek dole, celoobrazovkový průvodce pro probuzení, protažení, AMRAP a meditaci */
:root{
  --bg:#FBF4E6; --surface:#FFFFFF; --ink:#051822; --muted:#5D6872; --line:#E7DDC9; --soft:#F5ECDA;
  --red:#C3302B; --navy:#051822; --cream:#FDEECF;
  --accent:#C3302B; --accent-ink:#FFFFFF;
  --ok:#2E7D57; --warn:#B7791F;
  --c-tl:#3A6A8C; --c-ta:#2E7D57; --c-co:#B7791F;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#051822; --surface:#0C2531; --ink:#F4ECDD; --muted:#9AAEB8; --line:#1C3A48; --soft:#11303E;
    --red:#E2483F; --accent:#E2483F; --accent-ink:#FFFFFF; --ok:#4DB485; --warn:#E0A23A;
    --c-tl:#6C9AC0; --c-ta:#4DB485; --c-co:#E0A23A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#051822; --surface:#0C2531; --ink:#F4ECDD; --muted:#9AAEB8; --line:#1C3A48; --soft:#11303E;
  --red:#E2483F; --accent:#E2483F; --accent-ink:#FFFFFF; --ok:#4DB485; --warn:#E0A23A;
  --c-tl:#6C9AC0; --c-ta:#4DB485; --c-co:#E0A23A;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
header.top{background:var(--navy);color:#F4ECDD;padding:calc(env(safe-area-inset-top) + 12px) 16px 14px}
header.top .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
header.top img{width:40px;height:40px;border-radius:50%;flex:none}
header.top .t{display:flex;flex-direction:column;line-height:1.1}
header.top b{font-size:20px;letter-spacing:-.01em}
header.top span{font-size:12px;opacity:.75;letter-spacing:.06em;text-transform:uppercase}
header.top .date{margin-left:auto;font-size:13px;opacity:.85;text-align:right}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 100px)}
h1,h2,h3{margin:0;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:30px;line-height:1.05;font-weight:800}
h2{font-size:22px;line-height:1.15;font-weight:800}
h3{font-size:18px;line-height:1.2;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.section{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.section:first-child{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kicker{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.kv{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;border:1.5px solid currentColor;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-red{color:var(--red)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700}
button:disabled{opacity:.45}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.btn-main{background:var(--red);border-color:var(--red);color:#fff}
.btn-navy{background:var(--navy);border-color:var(--navy);color:#F4ECDD}
.btn-big{width:100%;padding:16px;font-size:18px;border-radius:16px}
.btn-sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn-ghost{background:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:99px;font-size:13px;background:var(--soft)}
.chip[aria-pressed="true"]{background:var(--navy);color:#F4ECDD;border-color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}}
input[type=number],input[type=text],select,textarea{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
textarea{min-height:64px;resize:vertical}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tip{background:var(--soft);border-left:3px solid var(--red);padding:9px 11px;border-radius:8px;font-size:14px}
ul.clean,ol.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.warn li::marker{color:var(--red)}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details>summary{list-style:none;padding:13px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-size:22px;color:var(--muted);flex:none;font-weight:300}
details[open]>summary::after{content:"\2212"}
details .inner{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.quote{background:var(--navy);color:#F4ECDD;border:0}
.quote .q{font-size:21px;line-height:1.3;font-weight:700;margin:6px 0 8px}
.quote .a{font-size:13px;opacity:.75}
.quote .kicker{color:#F08A84}
.figbox{background:var(--soft);border-radius:12px;position:relative}
.figbox svg{display:block;width:100%;height:auto}
.figbox .view{position:absolute;right:8px;top:6px;font-size:11px;color:var(--muted)}
.exrow{display:grid;grid-template-columns:84px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:0}
.exrow .nm{font-weight:700;line-height:1.2}
.exrow .rp{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--red);white-space:nowrap}
.series{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;padding:14px;font-weight:400}
.series .let{width:48px;height:48px;border-radius:12px;background:var(--navy);color:#F4ECDD;display:grid;place-items:center;font-size:24px;font-weight:800}
.series.rec{border:2px solid var(--red)}
.series .best{text-align:right;font-size:13px;color:var(--muted)}
.series .best b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);margin:0;color:var(--ink);font-size:15px}
.check:last-child{border-bottom:0}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--red);flex:none}
.check.done>span>b{text-decoration:line-through;color:var(--muted)}
.deck{min-height:190px;display:flex;flex-direction:column;justify-content:center;gap:10px;touch-action:pan-y}
.deck .big{font-size:22px;line-height:1.3;font-weight:700}
.deck .num{font-size:12px;color:var(--muted)}
.supp{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.supp:last-child{border-bottom:0}
.supp .ctl{display:flex;align-items:center;gap:6px}
.supp .ctl button{width:40px;height:40px;padding:0;font-size:20px;border-radius:50%}
.supp .amt{min-width:64px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.supp.hit .amt{color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center}
.stat b{display:block;font-size:30px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 5px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.heat{display:grid;grid-template-columns:110px repeat(28,1fr);gap:2px;align-items:center;font-size:12px}
.heat i{display:block;aspect-ratio:1;border-radius:2px;background:var(--line)}
.heat i.on{background:var(--ok)} .heat i.part{background:var(--warn)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;padding:0;font-size:18px}
.stepper output{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.mealrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:10}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;width:100%;gap:4px}
nav.tabs a{color:var(--muted);text-decoration:none;font-size:11px;font-weight:700;text-align:center;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs a svg{width:23px;height:23px}
nav.tabs a[aria-current="page"]{color:var(--red);background:var(--soft)}
.view-s{display:none}.view-s.on{display:block}
/* overlay */
.run{position:fixed;inset:0;background:var(--bg);z-index:15;display:none;flex-direction:column}
.run.on{display:flex}
.r-top{background:var(--navy);color:#F4ECDD;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.r-top .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.r-top .kicker{color:#F08A84}
.bar{height:5px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);width:0}
.r-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.r-chips .chip{white-space:nowrap;font-size:12px;padding:4px 10px;background:rgba(255,255,255,.1);border-color:transparent;color:#F4ECDD}
.r-chips .chip[aria-pressed="true"]{background:var(--red);color:#fff}
.r-body{flex:1;overflow:auto;padding:16px;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.r-foot{padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line);background:var(--surface)}
.r-foot .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:8px}
.r-foot .in>button[hidden]{display:block;visibility:hidden}
.r-foot .sub{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px}
.g-title{font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
.g-cmd{font-size:19px;line-height:1.4;font-weight:500}
.clock{font-size:84px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:-.02em}
.clock.mid{font-size:60px}
.rounds{display:grid;grid-template-columns:80px 1fr 80px;gap:10px;align-items:center;text-align:center}
.rounds .num{font-size:60px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.rounds button{height:80px;font-size:34px;border-radius:18px}
.mini{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.mini:last-child{border-bottom:0}
.mini .nm{font-weight:700;line-height:1.2}
.mini .rp{font-weight:800;color:var(--red);font-variant-numeric:tabular-nums;white-space:nowrap}
.slider label{display:flex;justify-content:space-between;font-size:15px;color:var(--ink);font-weight:700}
.slider input{width:100%;accent-color:var(--red);height:32px}
.slider .scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.breath{position:relative;height:220px;display:grid;place-items:center}
.breath .ring{position:absolute;width:200px;height:200px;border-radius:50%;background:var(--red);opacity:.22;transform:scale(.55);transition:transform .25s linear}
.breath span{position:relative;font-size:28px;font-weight:800}
.sheet-bg{position:fixed;inset:0;background:rgba(5,24,34,.6);z-index:30;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 90px);background:var(--navy);color:#F4ECDD;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:40;display:none;max-width:90%;text-align:center}
.toast.on{display:block}
.ok{color:var(--ok);font-weight:700} .bad{color:var(--red);font-weight:700}
@media (max-width:380px){.clock{font-size:68px}.grid3{grid-template-columns:1fr 1fr}.exrow{grid-template-columns:64px 1fr auto}}
</style>
</head>
<body>
<header class="top"><div class="in"><img src="logo.png" alt="Logo Hodinový Instruktor"><div class="t"><b>Perfektní ráno</b><span>Hodinový Instruktor</span></div><div class="date" id="hDate"></div></div></header>
<main>
<section class="view-s" id="v-rano" aria-label="Ráno"></section>
<section class="view-s" id="v-pohyb" aria-label="Pohyb"></section>
<section class="view-s" id="v-suple" aria-label="Suplementy"></section>
<section class="view-s" id="v-jidlo" aria-label="Jídlo"></section>
<section class="view-s" id="v-historie" aria-label="Historie"></section>
</main>

<div class="run" id="run" role="dialog" aria-modal="true" aria-label="Průvodce">
  <div class="r-top"><div class="in">
    <div class="row between"><span class="kicker" id="rKick"></span><span class="small" id="rCount" style="opacity:.75"></span></div>
    <div class="bar"><i id="rBar"></i></div>
    <div class="r-chips" id="rChips"></div>
  </div></div>
  <div class="r-body" id="rBody"></div>
  <div class="r-foot"><div class="in">
    <div class="sub"><button class="btn-sm btn-ghost" id="rMenu">Menu</button><button class="btn-sm" id="rPlus" hidden>+30 s</button><button class="btn-sm btn-ghost" id="rSkip">Přeskočit</button></div>
    <button id="rBack">Zpět</button>
    <button class="btn-main" id="rMain">Start</button>
    <button id="rNext">Další</button>
  </div></div>
</div>

<nav class="tabs" aria-label="Navigace"><div class="wrap">
  <a href="#rano" data-v="rano"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18h18M6 18a6 6 0 0 1 12 0M12 4v3M4.9 9.9l1.4 1.4M19.1 9.9l-1.4 1.4"/></svg>Ráno</a>
  <a href="#pohyb" data-v="pohyb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 5a4 4 0 0 1 8 0"/><path d="M6 9h12l-1 9a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3z"/></svg>Pohyb</a>
  <a href="#suple" data-v="suple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="9" width="18" height="7" rx="3.5" transform="rotate(-35 12 12.5)"/><path d="M9.5 8.5l5 7"/></svg>Suplementy</a>
  <a href="#jidlo" data-v="jidlo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11h16a8 8 0 0 1-16 0zM9 7c0-2 2-2 2-4M14 7c0-2 2-2 2-4"/></svg>Jídlo</a>
  <a href="#historie" data-v="historie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Historie</a>
</div></nav>

<div class="sheet-bg" id="sheetBg" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= FIGURY (motor animací) ================= */
const LEN={th:38,sn:36,ua:26,fa:24,to:48,nk:17,hr:9};
const GROUND=170;
const DEF={hp:[100,97],t:0,a1:[103,170],a2:[98,170],w1r:[3,49],w2r:[-2,49]};
const dirv=a=>{const r=a*Math.PI/180;return [Math.sin(r),-Math.cos(r)];};
const lerp=(a,b,u)=>a+(b-a)*u;
const lerp2=(A,B,u)=>[lerp(A[0],B[0],u),lerp(A[1],B[1],u)];
function ik(A,B,l1,l2,pref){
  let dx=B[0]-A[0],dy=B[1]-A[1],d=Math.hypot(dx,dy);const mx=l1+l2-0.3;let E=B;
  if(d>mx){const k=mx/d;dx*=k;dy*=k;d=mx;E=[A[0]+dx,A[1]+dy];}
  d=Math.max(d,Math.abs(l1-l2)+0.5);
  const base=Math.atan2(dy,dx),a=Math.acos(Math.min(1,Math.max(-1,(l1*l1+d*d-l2*l2)/(2*l1*d))));
  const j1=[A[0]+l1*Math.cos(base+a),A[1]+l1*Math.sin(base+a)],j2=[A[0]+l1*Math.cos(base-a),A[1]+l1*Math.sin(base-a)];
  let j;if(pref==="b")j=j1[0]<j2[0]?j1:j2;else if(pref==="u")j=j1[1]<j2[1]?j1:j2;else if(pref==="d")j=j1[1]>j2[1]?j1:j2;else j=j1[0]>j2[0]?j1:j2;
  return [j,E];
}
const full=k=>Object.assign({},DEF,k,{w1r:k.w1?null:(k.w1r||DEF.w1r),w2r:k.w2?null:(k.w2r||DEF.w2r)});
function shOf(k){const d=dirv(k.t);return [k.hp[0]+d[0]*LEN.to,k.hp[1]+d[1]*LEN.to];}
function blend(A,B,u){
  const hp=lerp2(A.hp,B.hp,u),t=lerp(A.t,B.t,u);
  const sh=(()=>{const d=dirv(t);return [hp[0]+d[0]*LEN.to,hp[1]+d[1]*LEN.to];})();
  const pick=key=>u<0.5?A[key]:B[key];
  const wr=i=>{const r="w"+i+"r",a="w"+i;
    if(A[r]&&B[r]){const v=lerp2(A[r],B[r],u);return [sh[0]+v[0],sh[1]+v[1]];}
    const sa=shOf(A),sb=shOf(B);const pa=A[a]||[sa[0]+A[r][0],sa[1]+A[r][1]];const pb=B[a]||[sb[0]+B[r][0],sb[1]+B[r][1]];return lerp2(pa,pb,u);};
  const hA=A.h!==undefined?A.h:A.t,hB=B.h!==undefined?B.h:B.t;
  return {hp,t,sh,h:lerp(hA,hB,u),c:lerp(A.c||0,B.c||0,u),a1:lerp2(A.a1,B.a1,u),a2:lerp2(A.a2,B.a2,u),w1:wr(1),w2:wr(2),
    k1:pick("k1")||"f",k2:pick("k2")||"f",e1:pick("e1")||"b",e2:pick("e2")||"b"};
}
function solve(P){
  const [kn1,an1]=ik(P.hp,P.a1,LEN.th,LEN.sn,P.k1),[kn2,an2]=ik(P.hp,P.a2,LEN.th,LEN.sn,P.k2);
  const [el1,wr1]=ik(P.sh,P.w1,LEN.ua,LEN.fa,P.e1),[el2,wr2]=ik(P.sh,P.w2,LEN.ua,LEN.fa,P.e2);
  const hd=dirv(P.h),head=[P.sh[0]+hd[0]*LEN.nk,P.sh[1]+hd[1]*LEN.nk];
  return {hp:P.hp,sh:P.sh,head,c:P.c,k1:kn1,a1:an1,k2:kn2,a2:an2,e1:el1,w1:wr1,e2:el2,w2:wr2};
}
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;

const QUOTES=[
 {a:"Marcus Aurelius",s:"Hovory k sobě 8.47",q:"Když tě trápí něco vnějšího, netrápí tě ta věc, ale tvůj úsudek o ní. A ten můžeš hned teď smazat.",ask:"Který úsudek mi dnes zbytečně bere energii?",do:"Napiš jednu situaci jako holý fakt, bez hodnocení."},
 {a:"Epiktétos",s:"Příručka 1",q:"Některé věci jsou v naší moci, jiné ne. V naší moci je úsudek, snaha a odmítnutí. Mimo ni je tělo, majetek, pověst a postavení.",ask:"Co z dnešního plánu opravdu řídím já?",do:"Rozděl největší starost dne na dva sloupce: řídím a neřídím."},
 {a:"Seneca",s:"Dopisy Luciliovi 13",q:"Víc věcí nás straší, než nás ohrožuje. Častěji trpíme v představách než ve skutečnosti.",ask:"Čeho se dnes bojím víc, než je potřeba?",do:"U obavy napiš nejhorší realistický scénář a svou pojistku."},
 {a:"Marcus Aurelius",s:"Hovory k sobě 5.1",q:"Za úsvitu, když se ti nechce vstávat, si řekni: vstávám k práci člověka. Proč bych reptal, když jdu dělat to, kvůli čemu jsem tady?",ask:"Jakou práci dnes jdu odvést?",do:"Řekni nahlas jednu větu, proč dnes vstáváš."},
 {a:"Seneca",s:"O krátkosti života 1",q:"Život není krátký. Krátký ho děláme my, protože ho promrháme.",ask:"Kde dnes nejspíš promrhám čas?",do:"Zablokuj v plánu jeden blok hluboké práce bez telefonu."},
 {a:"Epiktétos",s:"Rozpravy 3.23",q:"Nejdřív si řekni, kým chceš být. Pak dělej, co musíš.",ask:"Kým chci dnes být v práci, v tréninku a doma?",do:"Napiš tři slova, která popíšou, jak se dnes chceš chovat."},
 {a:"Marcus Aurelius",s:"Hovory k sobě 4.3",q:"Lidé hledají útočiště na venkově, u moře, v horách. Přitom se můžeš kdykoli uchýlit do sebe. Klidnější místo nenajdeš.",ask:"Kde dnes budu potřebovat vnitřní klid?",do:"Nastav si v poledne 3 minuty dechu."},
 {a:"Seneca",s:"Dopisy Luciliovi 1",q:"Zatímco odkládáme, život utíká.",ask:"Co odkládám už příliš dlouho?",do:"Dej to jako první úkol dne, aspoň na 15 minut."},
 {a:"Marcus Aurelius",s:"Hovory k sobě 7.69",q:"Dokonalost charakteru je prožít každý den jako poslední. Bez rozčilení, bez otupělosti, bez přetvářky.",ask:"Co bych dnes udělal jinak, kdyby to byl poslední den?",do:"Pošli zprávu nebo zavolej člověku, kterému to dlužíš."},
 {a:"Epiktétos",s:"Příručka 5",q:"Lidi neznepokojují věci samy, ale jejich názory na ty věci.",ask:"Jaký názor dnes mění fakt v problém?",do:"Přeformuluj jednu starost na otázku: co s tím udělám?"},
 {a:"Seneca",s:"Dopisy Luciliovi 91",q:"Ať tě nic nezaskočí. Co si promyslíš předem, ztratí nad tebou moc, až to přijde.",ask:"Co se dnes může pokazit u klienta, na akci nebo cestou?",do:"Zapiš riziko dne a pojistku do deníku."},
 {a:"Marcus Aurelius",s:"Hovory k sobě 2.1",q:"Hned ráno si řekni: potkám dnes nevděčné, drzé a závistivé lidi. Nikdo z nich mi neublíží, protože mě nikdo nedonutí jednat špatně.",ask:"Na koho dnes můžu narazit a jak zůstanu v klidu?",do:"Připrav si jednu klidnou větu pro konfliktní moment."},
 {a:"Epiktétos",s:"Příručka 8",q:"Nechtěj, aby se věci děly, jak chceš ty. Chtěj, aby se děly, jak se dějí, a budeš v klidu.",ask:"Co dnes musím přijmout, místo abych se s tím pral?",do:"Jmenuj jednu věc, kterou dnes přestaneš řešit."},
 {a:"Seneca",s:"Dopisy Luciliovi 28",q:"Musíš změnit duši, ne místo. Ať jedeš kamkoli, vezeš si sebe s sebou.",ask:"Před čím utíkám, místo abych to řešil?",do:"Napiš první krok k věci, které se vyhýbáš."},
 {a:"Marcus Aurelius",s:"Hovory k sobě 10.16",q:"Už nemluv o tom, jaký má být dobrý člověk. Buď jím.",ask:"Kde dnes místo mluvení jednám?",do:"Splň jeden slib, který jsi někomu dal."},
 {a:"Seneca",s:"O hněvu 2.29",q:"Nejlepší lék na hněv je odklad.",ask:"Co mě dnes může vytočit?",do:"Pravidlo dne: na naštvanou zprávu odpovídám nejdřív za hodinu."},
 {a:"Marcus Aurelius",s:"Hovory k sobě 6.2",q:"Je jedno, jestli ti je zima nebo teplo, jestli ses vyspal, nebo ne. Hlavně když děláš, co máš.",ask:"Jaká výmluva mě dnes může zastavit?",do:"Udělej trénink i bez nálady, klidně jako lehký den."},
 {a:"Seneca",s:"Dopisy Luciliovi 2",q:"Kdo je všude, není nikde.",ask:"Na co se dnes potřebuju soustředit naplno?",do:"60 minut jedna priorita, telefon v jiné místnosti."},
 {a:"Marcus Aurelius",s:"Hovory k sobě 8.36",q:"Nenech se rozhodit představou celého života. Ptej se u každé věci zvlášť: co je na ní neúnosného?",ask:"Který velký projekt mě děsí, když ho vidím celý?",do:"Rozlož ho na první krok do 30 minut."},
 {a:"Seneca",s:"Dopisy Luciliovi 7",q:"Lidé se učí, když učí druhé.",ask:"Co dnes můžu předat týmu nebo klientovi?",do:"Vysvětli někomu jednu věc, kterou umíš."},
 {a:"Marcus Aurelius",s:"Hovory k sobě 5.20",q:"Co stojí v cestě jednání, posouvá jednání dál. Překážka se stává cestou.",ask:"Jaká dnešní překážka je ve skutečnosti příležitost?",do:"U jednoho problému napiš, co tě naučí."},
 {a:"Seneca",s:"Dopisy Luciliovi 104",q:"Neodvažujeme se ne proto, že jsou věci těžké. Jsou těžké, protože se neodvažujeme.",ask:"Do čeho se dnes bojím jít?",do:"Jeden obchodní telefonát nebo e-mail, který odkládáš."},
 {a:"Marcus Aurelius",s:"Hovory k sobě 4.24",q:"Většina toho, co říkáme a děláme, není nutná. Když to vynecháš, budeš mít víc času i klidu. U každé věci se ptej: je to nutné?",ask:"Co dnes vyškrtnu?",do:"Smaž nebo deleguj jeden úkol ze seznamu."},
 {a:"Seneca",s:"Dopisy Luciliovi 107",q:"Osud vede toho, kdo jde ochotně. Toho, kdo se vzpírá, vláčí.",ask:"Kde se dnes zbytečně vzpírám?",do:"Přijmi jednu nepříjemnost dne bez stížnosti."},
 {a:"Marcus Aurelius",s:"Hovory k sobě 7.59",q:"Kopej uvnitř. Uvnitř je pramen dobra a vytryskne, když budeš kopat.",ask:"Jakou vlastnost v sobě dnes posílím?",do:"Večer zapiš jednu situaci, kde jsi ji ukázal."},
 {a:"Epiktétos",s:"Rozpravy 1.15",q:"Nic velkého nevznikne naráz, ani hrozen, ani fík. Chceš fík? Řeknu ti: potřebuje čas.",ask:"Kde jsem netrpělivý s výsledky?",do:"Zapiš jeden malý krok, který dnes uděláš bez ohledu na výsledek."},
 {a:"Seneca",s:"Dopisy Luciliovi 18",q:"Dopřej si občas pár dní skromnosti a ptej se: tohohle jsem se bál?",ask:"Bez čeho bych to zvládl líp, než si myslím?",do:"Dnes jeden den bez jedné pohodlné věci."},
 {a:"Marcus Aurelius",s:"Hovory k sobě 9.6",q:"Stačí ti pravdivý úsudek v tuhle chvíli, jednání k užitku druhých v tuhle chvíli a klidné přijetí toho, co právě přichází.",ask:"Co je moje jediná úloha v příští hodině?",do:"Napiš ji a dělej jen ji."},
 {a:"Seneca",s:"Dopisy Luciliovi 16",q:"Filozofie neučí mluvit, ale jednat.",ask:"Jakou jednu zásadu dnes převedu do činu?",do:"Napiš ji na papír a dej ho na stůl."},
 {a:"Epiktétos",s:"Rozpravy 4.1",q:"Svobodný není ten, kdo má všechno, ale ten, kdo se nenechá ovládat svými chtíči.",ask:"Který zvyk mě dnes ovládá?",do:"Odlož telefon na první hodinu po tréninku."}
];

let czVoice=null;

let actx=null;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(e){}try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);}catch(e){}}
function beep(times,freq){if(!actx)return;for(let i=0;i<times;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=freq||880;o.connect(g);g.connect(actx.destination);const t0=actx.currentTime+i*0.32;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.35,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.26);o.start(t0);o.stop(t0+0.28);}}

/* ================= TIMER ================= */
const T={end:null,left:0,dur:0,int:null,onTick:null,onDone:null,cues:{},fired:{}};
function tStart(){if(T.end)return;T.end=Date.now()+T.left*1000;T.int=setInterval(tTick,200);tTick();}
function tPause(){if(!T.end)return;T.left=Math.max(0,(T.end-Date.now())/1000);T.end=null;clearInterval(T.int);T.int=null;tTick();}
function tSet(sec,onTick,onDone,cues){tPause();T.dur=sec;T.left=sec;T.onTick=onTick;T.onDone=onDone;T.cues=cues||{};T.fired={};}
function tStop(){tPause();T.onTick=null;T.onDone=null;}
function tAdd(sec){T.dur+=sec;if(T.end)T.end+=sec*1000;else T.left+=sec;tTick();}
function tTick(){
  const left=T.end?(T.end-Date.now())/1000:T.left;const s=Math.max(0,Math.ceil(left));
  if(T.end){Object.keys(T.cues).forEach(k=>{if(s<=+k&&!T.fired[k]&&T.dur>+k){T.fired[k]=1;T.cues[k]();}});}
  T.onTick&&T.onTick(s,!!T.end);
  if(T.end&&left<=0){T.left=0;T.end=null;clearInterval(T.int);T.int=null;const f=T.onDone;f&&f();}
}

/* ================= STAV TĚLA ================= */
function baseline(){
  const prev=Object.keys(S.days).filter(k=>k<TODAY).sort().reverse().map(k=>S.days[k]);
  const sl=prev.filter(d=>d.sleep>0).slice(0,7).map(d=>d.sleep),hr=prev.filter(d=>d.hr>0).slice(0,7).map(d=>d.hr);
  const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
  return {sleep:sl.length>=3?avg(sl):7.5,hr:hr.length>=3?avg(hr):48,n:Math.min(sl.length,hr.length)};
}
function readiness(d){
  if(!(d.sleep>0)&&!(d.hr>0))return null;
  const b=baseline();const dh=d.hr>0?d.hr-b.hr:0;
  if((d.sleep>0&&d.sleep<5.5)||dh>=8)return {lvl:"rest",t:"Regenerace",c:"c-red",msg:"Tělo je pod zátěží. Dnes jen protažení a procházka, AMRAP vynech."};
  if((d.sleep>0&&d.sleep<6.5)||dh>=5)return {lvl:"light",t:"Lehký den",c:"c-warn",msg:"Jeď sérii D nebo C na RPE 6, tempo, při kterém můžeš mluvit."};
  return {lvl:"go",t:"Plný trénink",c:"c-ok",msg:"Tělo je připravené. Jeď doporučenou sérii naplno."};
}
const yBJJ=()=>!!(S.days[addDays(TODAY,-1)]||{}).bjj;
function recSeries(){
  const last=S.workouts.slice().sort((a,b)=>b.ts-a.ts)[0];
  let next=last?SERIES[(SERIES.findIndex(s=>s.id===last.series)+1)%SERIES.length].id:"A";
  const r=readiness(day());
  if((r&&r.lvl==="light")||yBJJ()){if(!["C","D"].includes(next))next=last&&last.series==="D"?"C":"D";}
  return next;
}

function lineSVG(pts,opt){

  const vals=v.map(p=>p.v);let mn=Math.min(...vals),mx=Math.max(...vals);if(mx-mn<1){mn-=1;mx+=1;}const padv=(mx-mn)*0.15;mn-=padv;mx+=padv;
  const W=320,H=120,n=pts.length,x=i=>12+i*(W-24)/Math.max(1,n-1),y=val=>H-18-(val-mn)/(mx-mn)*(H-34);
  const seg=pts.map((p,i)=>p.v!=null?[x(i),y(p.v),p.v]:null).filter(Boolean);
  const path=seg.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=path+` L${seg[seg.length-1][0].toFixed(1)} ${H-18} L${seg[0][0].toFixed(1)} ${H-18} Z`;const last=seg[seg.length-1];
  const grid=[0.25,0.5,0.75].map(f=>`<line x1="12" x2="${W-12}" y1="${(H-18-f*(H-34)).toFixed(1)}" y2="${(H-18-f*(H-34)).toFixed(1)}" stroke="var(--line)"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="${esc(opt.label)}">${grid}<path d="${area}" fill="var(--red)" opacity=".12"/><path d="${path}" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linejoin="round"/>
   <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5" fill="var(--red)"/><text x="${Math.min(last[0],W-14).toFixed(1)}" y="${(last[1]-9).toFixed(1)}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">${opt.fmt?opt.fmt(last[2]):last[2]}</text>
   <text x="12" y="${H-3}" font-size="10" fill="var(--muted)">${esc(opt.from||"")}</text><text x="${W-12}" y="${H-3}" font-size="10" fill="var(--muted)" text-anchor="end">${esc(opt.to||"dnes")}</text></svg>`;
}

/* ================= PRŮVODCE (probuzení, protažení, AMRAP, meditace) ================= */
const R={open:false,mode:null,steps:[],i:0,phase:null,MS:null};
function openRun(mode){
  unlockAudio();keepAwake(true);R.mode=mode;R.i=0;R.MS=null;R.open=true;
  if(mode==="wake"){R.steps=WAKE.map(w=>({k:"wake",id:w.id}));const d=day();const f=WAKE.findIndex(w=>!d.wake[w.id]);R.i=f<0?0:f;}
  if(mode==="stretch")R.steps=STRETCH.map(s=>({k:"timed",it:s}));
  if(mode==="cool")R.steps=COOL.map(s=>({k:"timed",it:s}));
  if(mode==="medit")R.steps=[{k:"medit"}];
  if(mode.startsWith("amrap:")){const id=mode.split(":")[1];R.ser=id;R.steps=[{k:"apre"},{k:"arun"},{k:"afin"}];const saved=JSON.parse(localStorage.getItem("hi-amrap-live")||"null");if(saved&&saved.date===TODAY&&saved.series===id){R.live=saved;R.i=saved.phase;}else R.live={date:TODAY,series:id,rounds:0,reps:0,phase:0,left:1200,kg:S.sw[id]};}
  $("#run").classList.add("on");document.body.style.overflow="hidden";renderStep(true);
}
function saveLive(){if(R.live){R.live.phase=R.i;R.live.left=Math.ceil(T.end?(T.end-Date.now())/1000:T.left)||R.live.left;localStorage.setItem("hi-amrap-live",JSON.stringify(R.live));}}
function closeRun(){if(R.live&&R.steps[R.i]&&R.steps[R.i].k==="arun"){tPause();saveLive();}tStop();R.open=false;$("#run").classList.remove("on");document.body.style.overflow="";keepAwake(false);try{speechSynthesis.cancel();}catch(e){}renderAll();}
function goStep(n){tStop();R.i=Math.max(0,Math.min(R.steps.length-1,n));renderStep(true);}
function nextStep(){if(R.i<R.steps.length-1)goStep(R.i+1);else finishRun();}
function finishRun(){
  if(R.mode==="stretch"){day().stretch=true;save();toast("Protažení hotové. Teď AMRAP.");}
  if(R.mode==="wake"){toast("Probuzení hotové");}
  closeRun();
}
function setFoot(o){

}

      ${w.id==="myslenka"?`<div class="card quote"><p class="q">${esc(q.q)}</p><p class="a">${esc(q.a)}, ${esc(q.s)}</p><p class="small" style="margin-top:8px"><b>Otázka do sešitu:</b> ${esc(q.ask)}</p><p class="small" style="margin-top:6px"><b>Praxe na dnešek:</b> ${esc(q.do)}</p></div>`:""}

      <div class="clock mid" id="rClock">${fmtT(it.sec)}</div><p class="small muted" style="text-align:center" id="rSide">${esc(it.d)}${it.sides?" · v půlce druhá strana":""}</p>

    mountFigs(body);setFoot({plus:true,skip:true});
    const cues={3:()=>beep(1,660),2:()=>beep(1,660),1:()=>beep(1,660)};
    if(it.sides)cues[Math.floor(it.sec/2)]=()=>{beep(2,990);speak("Druhá strana.");const e=$("#rSide");if(e)e.textContent="Druhá strana";};
    tSet(it.sec,(s,run)=>{const c=$("#rClock");if(c)c.textContent=fmtT(s);main.textContent=run?"Pauza":(s===0?"Další":(s<T.dur?"Pokračovat":"Start"));},()=>{beep(1,1200);main.textContent="Další";if(S.set.auto)setTimeout(()=>{if(R.open&&R.steps[R.i]===st&&T.left===0)nextStep();},900);},cues);
    main.textContent="Start";
    if(fresh){speak(`${it.n}. ${it.desc}`);if(R.i>0&&R.steps[R.i-1].k==="timed")setTimeout(()=>{if(R.open&&R.steps[R.i]===st&&!T.end&&T.left===T.dur)tStart();},2600);}
  }
  else if(st.k==="apre"){
    const s=SERBY[R.ser];
    body.innerHTML=`<div class="g-title">${esc(s.n)}</div><p class="small">${esc(s.focus)}</p>
      <div class="card"><div class="row between"><div><div class="kv">Váha kettlebellu na celou sérii</div><b style="font-size:28px">${R.live.kg} kg</b></div><div class="stepper"><button data-kg="-2" aria-label="Méně kg">−</button><button data-kg="2" aria-label="Více kg">+</button></div></div>${progressHint(R.ser)?`<p class="small c-ok" style="margin-top:6px"><b>${esc(progressHint(R.ser))}</b></p>`:""}</div>
      <div class="card"><div class="kv">Jedno kolo</div>${s.ex.map(([id,rp])=>{const e=EXA[id];return `<div class="exrow"><div>${figHTML(e.a,ANIM[e.a])}</div><div><div class="nm">${esc(e.n)}</div><div class="small muted">${esc(e.cue)}</div></div><div style="text-align:right"><div class="rp">${esc(rp.split(" ")[0])}</div><button class="btn-sm btn-ghost" style="padding:2px 6px" data-exa="${id}">Jak</button></div></div>`;}).join("")}</div>
      <div class="tip">Kolik kol zvládneš za 20 minut. Technika před tempem. Když se rozpadá, zpomal, nezastavuj.</div>`;
    mountFigs(body);setFoot({noBack:true,nextLabel:"Zavřít"});$("#rNext").hidden=true;main.textContent="Start AMRAP";
    if(fresh)speak(`Série ${s.id}, ${s.n}. `+s.ex.map(([id,rp])=>rp.split(" ")[0]+" "+EXA[id].n).join(", ")+".");
  }
  else if(st.k==="arun"){
    const s=SERBY[R.ser];
    body.innerHTML=`<div class="clock" id="rClock">${fmtT(R.live.left)}</div>
      <div class="rounds"><button id="rdMinus" aria-label="Odebrat kolo">−</button><div><div class="num" id="rdNum">${R.live.rounds}</div><div class="small muted">kol</div></div><button class="btn-main" id="rdPlus" aria-label="Přidat kolo">+</button></div>
      <div class="card"><div class="kv">Seznam cviků · ${R.live.kg} kg</div>${s.ex.map(([id,rp])=>{const e=EXA[id];return `<div class="mini"><div>${figHTML(e.a,ANIM[e.a])}</div><div class="nm">${esc(e.n)}</div><div class="rp">${esc(rp)}</div></div>`;}).join("")}</div>
      <p class="small muted" style="text-align:center">Po každém celém kole klepni na +. Displej nech zapnutý.</p>`;
    mountFigs(body);setFoot({plus:true,plusLabel:"+1 min",noBack:true,nextLabel:"Ukončit"});
    const cues={600:()=>{speak("Polovina. Deset minut.");beep(2);},300:()=>{speak("Pět minut.");beep(2);},60:()=>{speak("Poslední minuta.");beep(2);},10:()=>speak("Deset sekund."),3:()=>beep(1,660),2:()=>beep(1,660),1:()=>beep(1,660)};
    tSet(R.live.left,(sec,run)=>{const c=$("#rClock");if(c)c.textContent=fmtT(sec);main.textContent=run?"Pauza":(sec===0?"Zapsat výsledek":(sec<1200?"Pokračovat":"Start"));if(run&&sec%5===0)saveLive();},()=>{beep(3,1200);speak("Konec. Zapiš výsledek.");try{navigator.vibrate&&navigator.vibrate([300,150,300]);}catch(e){}main.textContent="Zapsat výsledek";saveLive();},cues);
    T.dur=1200;main.textContent=R.live.left<1200?"Pokračovat":"Start";
    if(fresh&&R.live.left===1200){speak("Tři, dva, jedna. Start.");setTimeout(()=>{if(R.open&&R.steps[R.i]===st&&!T.end)tStart();},2200);}
  }
  else if(st.k==="afin"){

function renderMedit(fresh){
  const body=$("#rBody"),main=$("#rMain");
  if(!R.MS){
    body.innerHTML=`<div class="g-title">Meditace</div><p class="small muted">Vyber typ a délku. Kdykoli můžeš pozastavit, prodloužit nebo ukončit.</p>
      ${MED.map(m=>`<div class="card stack"><div class="row between"><h3>${esc(m.n)}</h3><span class="small muted">${m.type==="breath"?"kruh dechu":m.type==="guided"?"hlasem":"bez vedení"}</span></div><p class="small">${esc(m.d)}</p><div class="row">${m.lens.map(l=>`<button class="btn-sm" data-med="${m.id}|${l}">${l} min</button>`).join("")}</div></div>`).join("")}`;
    setFoot({noNext:true});main.textContent="Zavřít";return;
  }
  const m=MEDBY[R.MS.id];const total=R.MS.len*60;
  body.innerHTML=`<span class="kicker">${esc(m.n)}</span><div class="breath"><div class="ring" id="mRing"></div><span id="mPhase">${m.type==="breath"?"Připrav se":""}</span></div>
    <div class="clock mid" id="rClock">${fmtT(total)}</div><p class="g-cmd" id="mLine" style="text-align:center;min-height:3em">${m.type==="silent"?"Pozoruj dech. Když odbíhají myšlenky, vrať se k dechu.":(m.type==="breath"?"Sleduj kruh. Nádech nosem, výdech pusou.":"Klepni na start a zavři oči.")}</p>
    <button class="btn-sm btn-ghost" id="mEnd" style="align-self:center">Vybrat jinou</button>`;
  setFoot({plus:true,plusLabel:"+1 min",noNext:true});
  $("#mEnd").onclick=()=>{tStop();R.MS=null;renderMedit(false);};
  const fired={};const ph=["Nádech","Zadrž","Výdech","Zadrž"];let lastPh=-1;
  tSet(total,(s,run)=>{
    const c=$("#rClock");if(c)c.textContent=fmtT(s);main.textContent=run?"Pauza":(s===0?"Hotovo":(s<T.dur?"Pokračovat":"Start"));if(!run)return;
    const el=T.dur-((T.end-Date.now())/1000);const ring=$("#mRing"),pe=$("#mPhase"),line=$("#mLine");
    if(m.type==="breath"&&ring){const cyc=el%16,p=Math.floor(cyc/4),u=(cyc%4)/4;const sc=p===0?0.55+0.45*u:p===1?1:p===2?1-0.45*u:0.55;ring.style.transform=`scale(${sc.toFixed(3)})`;if(p!==lastPh){lastPh=p;pe.textContent=ph[p];if(el<32)speak(ph[p]);else beep(1,p===0?520:p===2?390:450);}}

    if(m.type==="guided")m.script.forEach(([t,txt],i)=>{if(el>=t&&!fired[i]){fired[i]=1;if(line)line.textContent=txt;speak(txt);}});
    if(m.type==="silent"){if(el>=T.dur/2&&!fired.h){fired.h=1;beep(1,330);}}
  },()=>{beep(2,330);speak("Konec meditace.");const d=day();d.medit=(d.medit||0)+R.MS.len;save();main.textContent="Hotovo";const l=$("#mLine");if(l)l.textContent="Hotovo. Vezmi si ten klid do dne.";});
  main.textContent="Start";
}
function mainAction(){
  const st=R.steps[R.i];
  if(st.k==="wake"){day().wake[st.id]=true;save();nextStep();return;}
  if(st.k==="timed"){if(T.left===0&&!T.end){nextStep();return;}if(T.end)tPause();else tStart();return;}
  if(st.k==="apre"){S.sw[R.ser]=R.live.kg;save();goStep(1);return;}
  if(st.k==="arun"){if(T.left===0&&!T.end){R.live.left=0;goStep(2);saveLive();return;}if(T.end){tPause();saveLive();}else{if(T.left===1200)beep(1);tStart();}return;}
  if(st.k==="afin"){
    const l=R.live;const w={id:"w"+Date.now(),ts:Date.now(),date:TODAY,series:R.ser,kg:l.kg,rounds:l.rounds,reps:l.reps,feel:l.feel||7,rpe:l.rpe||8,note:(l.note||"").trim()};
    S.workouts.push(w);S.sw[R.ser]=l.kg;save();localStorage.removeItem("hi-amrap-live");R.live=null;toast("Trénink uložen");
    tStop();R.open=false;$("#run").classList.remove("on");document.body.style.overflow="";keepAwake(false);renderAll();
    openSheet("Hotovo",`<p>Série ${w.series}: <b>${w.rounds}${w.reps?" + "+w.reps:""} kol</b> na ${w.kg} kg.</p><p class="small">Teď ranní shake s kreatinem a do hodiny snídaně.</p><div class="row"><button class="btn-main" data-act="coolsheet">Protáhnout 3 min</button><button data-act="supsheet">Zapsat suplementy</button></div>`);
    return;
  }
  if(st.k==="medit"){if(!R.MS){closeRun();return;}if(T.left===0&&!T.end){closeRun();return;}if(T.end)tPause();else{if(T.left===T.dur&&MEDBY[R.MS.id].type==="silent")beep(1,330);tStart();}return;}
}

function renderAll(){$("#hDate").textContent=cap(fmtDate(TODAY));RENDER[curView()]();}

/* ================= UDÁLOSTI ================= */
document.addEventListener("click",async ev=>{
  if(ev.target===$("#sheetBg")){closeSheet();return;}
  const b=ev.target.closest("button, input[type=checkbox]");if(!b)return;const a=b.dataset.act;
  if(a==="sheetclose"){closeSheet();return;}
  if(a==="qnext"){const d=day();d.qi=((d.qi!==undefined?d.qi:dayOfYear(parseD(TODAY)))+1)%QUOTES.length;save();renderRano();return;}
  if(a==="qread"){unlockAudio();const q=quoteOf(TODAY);const was=S.set.voice;S.set.voice=true;speak(`${q.a}. ${q.q}`);S.set.voice=was;return;}
  if(a==="wake"){openRun("wake");return;}
  if(b.dataset.wk){day().wake[b.dataset.wk]=b.checked;save();b.closest(".check").classList.toggle("done",b.checked);renderRano();return;}
  if(a==="bjj"){const d=day();d.bjj=!d.bjj;save();renderRano();return;}
  if(b.dataset.deck){S.deck=b.dataset.deck;save();renderRano();return;}
  if(a==="cnext"||a==="cprev"||a==="crand"){const dk=DECKS.find(x=>x.id===S.deck)||DECKS[0];const n=dk.cards.length;let c=S.ci[dk.id]||0;c=a==="crand"?Math.floor(Math.random()*n):(c+(a==="cnext"?1:-1)+n)%n;S.ci[dk.id]=c;save();renderRano();return;}
  if(a==="medit"){openRun("medit");return;}
  if(b.dataset.goto){location.hash="#"+b.dataset.goto;return;}
  if(a==="stretch"){openRun("stretch");return;}
  if(a==="cool"||a==="coolsheet"){closeSheet();openRun("cool");return;}
  if(a==="supsheet"){closeSheet();location.hash="#suple";return;}
  if(b.dataset.series){openRun("amrap:"+b.dataset.series);return;}
  if(b.dataset.kg){R.live.kg=Math.max(12,Math.min(24,R.live.kg+(+b.dataset.kg)));saveLive();renderStep(false);return;}
  if(b.dataset.exa){exSheet(b.dataset.exa);return;}
  if(b.id==="rdPlus"){R.live.rounds++;$("#rdNum").textContent=R.live.rounds;saveLive();try{navigator.vibrate&&navigator.vibrate(40);}catch(e){}beep(1,1000);return;}
  if(b.id==="rdMinus"){R.live.rounds=Math.max(0,R.live.rounds-1);$("#rdNum").textContent=R.live.rounds;saveLive();return;}
  if(b.dataset.rr){R.live.rounds=Math.max(0,R.live.rounds+(+b.dataset.rr));saveLive();renderStep(false);return;}
  if(b.dataset.rp){R.live.reps=Math.max(0,R.live.reps+(+b.dataset.rp));saveLive();renderStep(false);return;}
  if(b.id==="rMain"){mainAction();return;}
  if(b.id==="rBack"){if(R.steps[R.i].k==="afin"){goStep(1);return;}goStep(R.i-1);return;}
  if(b.id==="rNext"){const k=R.steps[R.i].k;
    if(k==="apre"){closeRun();return;}
    if(k==="arun"){if(b.dataset.confirm){tPause();R.live.left=Math.ceil(T.left);goStep(2);saveLive();}else{b.dataset.confirm="1";b.textContent="Opravdu ukončit?";setTimeout(()=>{if(b.isConnected){delete b.dataset.confirm;b.textContent="Ukončit";}},3000);}return;}
    if(k==="afin"){if(b.dataset.confirm){localStorage.removeItem("hi-amrap-live");R.live=null;closeRun();toast("Trénink zahozen");}else{b.dataset.confirm="1";b.textContent="Opravdu zahodit?";setTimeout(()=>{if(b.isConnected){delete b.dataset.confirm;b.textContent="Zahodit";}},3000);}return;}
    nextStep();return;}
  if(b.id==="rSkip"){if(R.steps[R.i].k==="wake"){nextStep();return;}nextStep();return;}
  if(b.id==="rMenu"){closeRun();return;}
  if(b.id==="rPlus"){const k=R.steps[R.i].k;tAdd(k==="timed"?30:60);toast(k==="timed"?"+30 sekund":"+1 minuta");return;}
  if(b.dataset.jump!==undefined){goStep(+b.dataset.jump);return;}
  if(b.dataset.med){const [id,l]=b.dataset.med.split("|");R.MS={id,len:+l};renderMedit(true);return;}
  if(b.dataset.sp||b.dataset.sm){const id=b.dataset.sp||b.dataset.sm;const s=S.supp.find(x=>x.id===id);const d=day();d.supp[id]=Math.max(0,Math.round(((d.supp[id]||0)+(b.dataset.sp?s.step:-s.step))*100)/100);save();renderSuple();return;}
  if(a==="saddall"){const d=day();S.supp.forEach(s=>{if((d.supp[s.id]||0)<s.target){if(s.cycle&&cycleInfo(s).startsWith("Pauza"))return;d.supp[s.id]=s.target;}});save();renderSuple();toast("Zapsáno podle cílů");return;}
  if(a==="snew"){suppSheet(null);return;}
  if(b.dataset.sinfo){suppSheet(b.dataset.sinfo);return;}
  if(b.dataset.ssave){const s=sheetCtx;const n=$("#sn").value.trim();if(!n){toast("Doplň název");return;}s.n=n;s.u=$("#su").value.trim()||"dávka";s.step=num($("#sst").value)||1;s.target=num($("#sta").value)||s.step;s.when=$("#sw").value.trim();if($("#scy"))s.start=$("#scy").value.trim()||s.start;if(s.isNew){delete s.isNew;S.supp.push(s);}save();closeSheet();renderSuple();return;}
  if(b.dataset.sdel){if(b.dataset.confirm){S.supp=S.supp.filter(x=>x.id!==b.dataset.sdel);save();closeSheet();renderSuple();}else{b.dataset.confirm="1";b.textContent="Opravdu odebrat?";}return;}
  if(b.dataset.scstart){const s=S.supp.find(x=>x.id===b.dataset.scstart);s.start=TODAY;save();closeSheet();renderSuple();return;}
  if(b.dataset.recipe){const r=RBY[b.dataset.recipe];openSheet(r.n,recipeHTML(r));return;}
  if(b.dataset.wkp){const id=b.dataset.wkp;S.week[id]=Math.max(0,Math.min(14,(S.week[id]||0)+(+b.dataset.d)));save();renderJidlo();return;}
  if(b.dataset.ck!==undefined){S.checks[b.dataset.ck]=b.checked;save();b.closest(".check").classList.toggle("done",b.checked);return;}
  if(a==="uncheck"){S.checks={};save();renderJidlo();return;}
  if(a==="copyshop"){try{await navigator.clipboard.writeText(shopText());toast("Seznam zkopírován");}catch(e){toast("Kopírování tady nejde");}return;}
  if(b.dataset.wdel){if(b.dataset.confirm){S.workouts=S.workouts.filter(w=>w.id!==b.dataset.wdel);save();renderHistorie();toast("Smazáno");}else{b.dataset.confirm="1";b.textContent="Opravdu smazat?";setTimeout(()=>{if(b.isConnected){delete b.dataset.confirm;b.textContent="Smazat";}},3000);}return;}
  if(a==="exp"){try{const blob=new Blob([JSON.stringify(S)],{type:"application/json"});const u=URL.createObjectURL(blob);const l=document.createElement("a");l.href=u;l.download="hi-rano-zaloha-"+TODAY+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}catch(e){toast("Stažení nejde, použij kopírování");}return;}
  if(a==="expcopy"){try{await navigator.clipboard.writeText(JSON.stringify(S));toast("Záloha zkopírována, vlož ji do Poznámek");}catch(e){toast("Kopírování tady nejde");}return;}
  if(a==="imppaste"){openSheet("Obnovit zálohu",`<p class="small">Vlož text zálohy. Současná data se přepíšou.</p><textarea id="impTxt" style="min-height:140px"></textarea><button class="btn-main" data-act="impdo">Obnovit</button>`);return;}
  if(a==="impdo"){doImport($("#impTxt").value);closeSheet();return;}
});
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.menu){day().menu[e.target.dataset.menu]=e.target.value;save();renderJidlo();}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});
window.addEventListener("hashchange",route);

/* ================= START ================= */
$("#hDate").textContent=cap(fmtDate(TODAY));
route();requestAnimationFrame(animLoop);
(()=>{const live=JSON.parse(localStorage.getItem("hi-amrap-live")||"null");if(live&&live.date===TODAY&&live.phase>0){setTimeout(()=>{openRun("amrap:"+live.series);toast("Pokračuješ v rozdělaném AMRAPu");},300);}})();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body>
</html>
